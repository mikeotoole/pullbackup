[project]
name = "pullback"
version = "0.5.0"
description = "Pull-only rsync task manager"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "croniter>=3.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5.11",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pullback"]
