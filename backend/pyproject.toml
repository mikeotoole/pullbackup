[project]
name = "pullbackup"
version = "0.13.1"
description = "Pull-only rsync task manager"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "croniter>=3.0",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5.11",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    # Session-cookie signing. Pallets (Flask/Jinja/Click), ~15 years old, and
    # already what Starlette's own SessionMiddleware uses internally — so the
    # stack trusts it whether or not we declare it. Replaces ~100 lines of
    # hand-rolled HMAC + base64url + expiry code we would otherwise own.
    "itsdangerous>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pullbackup"]
