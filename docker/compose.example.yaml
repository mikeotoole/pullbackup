# Example Pullbackup deployment.
#
# No image is published yet, so this file builds one from the repository root
# (`build.context: ..`). Adjust the volumes and destination roots for your
# host, supply the environment values from a .env beside it (see
# ../.env.example), and run `docker compose up -d --build` from this directory.
# If you copy the file elsewhere, either fix `build.context` to point at your
# checkout or build the image first (`docker build -t pullbackup:local .` at
# the repository root) and delete the `build` block.
#
# Nothing here is required — Pullbackup is a single container plus one data
# volume. The extras below (ZFS device access, Traefik labels) are only needed
# for the features noted against them.

services:
  pullbackup:
    build:
      context: ..
    image: pullbackup:local
    container_name: pullbackup
    restart: unless-stopped
    # Modest limits: the container orchestrates rsync/syncoid, it does not do
    # the data movement in-process.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-UTC}
      PULLBACKUP_DATA_DIR: /data
      # Comma-separated allowlist. rsync destinations must live beneath one of
      # these paths; anything else is rejected before a run starts.
      PULLBACKUP_DEST_ROOTS: /mnt/dest/backups
      # Only needed for syncoid (ZFS) tasks. Leave blank to disable them.
      PULLBACKUP_ZFS_DEST_ROOTS: ""
      PULLBACKUP_MAX_CONCURRENT_RUNS: "1"
      # Required. The password must be at least 32 characters.
      # The UI signs in with these at /login and then uses a session cookie;
      # the same values keep working as HTTP Basic for scripted access and for
      # the healthcheck below.
      PULLBACKUP_HTTP_BASIC_USERNAME: ${PULLBACKUP_HTTP_BASIC_USERNAME:?required}
      PULLBACKUP_HTTP_BASIC_PASSWORD: ${PULLBACKUP_HTTP_BASIC_PASSWORD:?required}
      # Optional. Signs session cookies. Unset means the key is derived from
      # the password above, so changing the password signs everyone out.
      PULLBACKUP_SESSION_SECRET: ${PULLBACKUP_SESSION_SECRET:-}
      # Optional. Reverse proxies whose X-Forwarded-For may be believed,
      # comma-separated IPs or CIDRs. Set this whenever the container sits
      # behind the Traefik block at the bottom of this file: without it the
      # failed-login throttle sees the proxy's address for every caller and all
      # clients share one failure bucket, so five wrong guesses by anybody lock
      # the login form for everybody. Empty = no forwarding header is trusted.
      PULLBACKUP_TRUSTED_PROXIES: ${PULLBACKUP_TRUSTED_PROXIES:-}
      # Optional integrations. Blank disables the feature in the UI.
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
      MATRIX_ROOM_ID: ${MATRIX_ROOM_ID:-}
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME:-}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD:-}
    volumes:
      # Holds the SQLite database, run logs and the generated SSH key.
      # Back this up; do not point it at a fresh directory once in use.
      - ./data:/data
      # Mount each destination root you listed in PULLBACKUP_DEST_ROOTS.
      - /srv/backups:/mnt/dest/backups
    # /api/system/health is exempt from authentication, so this probe does not
    # actually need the Authorization header. It is kept because the exemption
    # is a deliberate, narrow carve-out: if it were ever removed, a probe that
    # already authenticates keeps the container healthy instead of restart-
    # looping. Adding the login session changed nothing here.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import base64,os,urllib.request,sys;
          credentials=(os.environ["PULLBACKUP_HTTP_BASIC_USERNAME"]+":"+os.environ["PULLBACKUP_HTTP_BASIC_PASSWORD"]).encode();
          request=urllib.request.Request("http://localhost:8000/api/system/health",headers={"Authorization":"Basic "+base64.b64encode(credentials).decode()});
          sys.exit(0 if urllib.request.urlopen(request,timeout=3).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3

# --- ZFS replication (syncoid tasks) -----------------------------------------
# Only if you want task_type=syncoid. rsync tasks need none of this.
# Add to the service above:
#
#   privileged: true
#   devices:
#     - /dev/zfs:/dev/zfs
#   volumes:
#     - /mnt/pool:/mnt/pool:rshared    # rshared so zfs mounts propagate
#     - /root/.ssh/id_syncoid:/keys/id_syncoid:ro
#
# and set PULLBACKUP_ZFS_DEST_ROOTS to the dataset roots you allow, e.g.
# "tank/replicas".

# --- Reverse proxy ------------------------------------------------------------
# Example Traefik labels, if you terminate TLS in front of the container:
#
#   labels:
#     - traefik.enable=true
#     - traefik.http.routers.pullbackup.rule=Host(`pullbackup.example.com`)
#     - traefik.http.routers.pullbackup.tls=true
#     - traefik.http.services.pullbackup.loadbalancer.server.port=8000
#
# If you enable this, ALSO set PULLBACKUP_TRUSTED_PROXIES above to the network
# Traefik reaches the container from (e.g. the docker network's subnet,
# 172.18.0.0/16). Otherwise the app sees Traefik's address as the client for
# every request and the failed-login throttle becomes shared: five wrong
# guesses by anyone lock the login form for everyone for 60 seconds. HTTP Basic
# keeps working throughout, so scripted access is never lost.

