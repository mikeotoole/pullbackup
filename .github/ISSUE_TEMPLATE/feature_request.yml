name: Feature request
description: Suggest something Pullbackup should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What are you trying to do that Pullbackup makes hard or impossible?
        Describe the situation rather than the solution — it often turns out
        there is a better fix than the one first imagined.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: |
        Workarounds you are using today. These are useful even when the feature
        is not built — they tell us how much the gap actually costs.
