name: Bug report
description: Something behaves differently than documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        **Do not paste real hostnames, paths, SSH keys or credentials.** A backup
        tool's logs are full of them. Redact before pasting — `example.internal`
        and `/srv/data` are fine stand-ins.
  - type: input
    id: version
    attributes:
      label: Version
      description: From `/api/system/health`, or the footer of the UI.
      placeholder: "0.14.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The most useful bug reports say what makes it happen reliably. If it only
        happens sometimes, say that too — intermittency is itself a clue.
      placeholder: |
        1. Create an rsync task pointing at ...
        2. Run it
        3. The run finishes in ~13ms with an empty log
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The run log, or the container log. Redact hostnames and paths.
      render: shell
  - type: dropdown
    id: task-type
    attributes:
      label: Task type
      options:
        - rsync
        - syncoid (ZFS)
        - not task-specific
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you deploy it, and anything unusual about the setup.
      placeholder: |
        Docker Compose on Debian 12, behind Traefik.
        Destination is a ZFS dataset bind-mounted at /mnt/dest/backups.
